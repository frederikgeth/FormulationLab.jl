<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
  <title id="title">Two-wire service with explicit neutral displacement</title>
  <desc id="desc">A 230 volt source supplies a two kilowatt load through a 0.2 ohm phase conductor and 0.3 ohm neutral. Only the source neutral is grounded. Current is 8.867 amperes, load voltage 225.567 volts, and downstream neutral voltage 2.660 volts.</desc>
  <rect width="800" height="340" rx="8" fill="#fff"/>
  <g font-family="sans-serif" font-size="16" fill="#263445">
    <text x="90" y="31" text-anchor="middle" font-weight="600">Source</text>
    <text x="620" y="31" text-anchor="middle" font-weight="600">Load bus</text>
    <text x="350" y="78" text-anchor="middle">Rₐ = 0.2 Ω</text>
    <text x="350" y="237" text-anchor="middle">Rₙ = 0.3 Ω</text>
    <text x="42" y="175" text-anchor="end">230 V</text>
    <text x="680" y="168">2 kW</text>
    <text x="680" y="190">Q = 0</text>
    <text x="72" y="87">a</text>
    <text x="72" y="230">n</text>
    <text x="635" y="88">a</text>
    <text x="635" y="246">n</text>
  </g>
  <g stroke="#263445" stroke-width="2" fill="none">
    <path d="M90 95H300M400 95H620V145M90 95V137M90 213V260H300M400 260H620V205"/>
    <rect x="300" y="84" width="100" height="22"/>
    <rect x="300" y="249" width="100" height="22"/>
    <circle cx="90" cy="175" r="38"/>
    <path d="M77 175q6-20 13 0t13 0"/>
    <rect x="600" y="145" width="40" height="60"/>
    <path d="M90 260V285M72 285H108M77 292H103M83 299H97"/>
  </g>
  <g fill="#263445"><circle cx="90" cy="95" r="4"/><circle cx="90" cy="260" r="4"/><circle cx="620" cy="95" r="4"/><circle cx="620" cy="260" r="4"/></g>
  <g stroke="#2069a0" stroke-width="2" fill="#2069a0">
    <path d="M175 55H245M235 50l10 5-10 5" fill="none"/>
    <path d="M245 290H175M185 285l-10 5 10 5" fill="none"/>
    <path d="M555 105V250M549 111l6-6 6 6M549 244l6 6 6-6" fill="none"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#2069a0">
    <text x="265" y="59">I = 8.867 A</text>
    <text x="470" y="160" text-anchor="middle">Uₐₙ</text>
    <text x="470" y="182" text-anchor="middle">225.567 V</text>
    <text x="560" y="293">Uₙ = 2.660 V</text>
  </g>
  <text x="400" y="325" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#586579">Only the source neutral is grounded · Series losses: 39.308 W</text>
</svg>
